<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢道具圖鑑</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #5c6b7a;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --drawer: #ffffff;
      --overlay: rgba(15, 23, 42, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1rem;
      padding-top: 3.5rem;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.45rem; font-weight: 700; margin-bottom: 1rem; text-align: center; }

    /* 左上浮動選單按鈕（跟隨閱讀） */
    .menu-fab {
      position: fixed;
      top: 0.85rem;
      left: 0.85rem;
      z-index: 100;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .menu-fab:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.18);
    }
    .menu-fab svg { width: 20px; height: 20px; }

    /* 遮罩 */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 110;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, visibility .2s;
    }
    .drawer-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* 左側滑出選單 */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: min(280px, 82vw);
      background: var(--drawer);
      z-index: 120;
      transform: translateX(-105%);
      transition: transform .25s ease;
      box-shadow: 4px 0 24px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1rem 1.5rem;
    }
    .drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .drawer-title {
      font-size: 1rem;
      font-weight: 700;
    }
    .drawer-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      font-size: 1.25rem;
      line-height: 1;
    }
    .drawer-close:hover { background: rgba(0,0,0,.05); color: var(--text); }
    .drawer-nav {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .drawer-nav a,
    .drawer-nav button {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }
    .drawer-nav a:hover,
    .drawer-nav button:hover {
      background: rgba(59, 130, 246, 0.08);
      border-color: rgba(59, 130, 246, 0.25);
      color: var(--accent);
    }

    .search-wrap { margin-bottom: 1.25rem; }
    .search-wrap input {
      width: 100%; max-width: 360px; padding: 0.65rem 0.9rem; font-size: 0.95rem;
      border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text);
    }
    .section { margin-bottom: 2rem; }
    .section-title {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem;
      padding-bottom: 0.4rem; border-bottom: 2px solid var(--accent);
      display: flex; align-items: baseline; gap: 0.5rem;
    }
    .section-title .count { font-size: 0.85rem; font-weight: 500; color: var(--muted); }
    .sub-title {
      font-size: 0.95rem; font-weight: 600; color: var(--muted);
      margin: 1rem 0 0.55rem;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.75rem;
    }
    .item-card {
      display: flex; gap: 0.75rem; align-items: flex-start;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.75rem 0.9rem; transition: border-color .15s;
    }
    .item-card:hover { border-color: var(--accent); }
    .item-icon {
      width: 40px; height: 40px; object-fit: contain; flex-shrink: 0;
      background: rgba(0,0,0,.03); border-radius: 8px;
    }
    .item-body { min-width: 0; flex: 1; }
    .item-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.15rem; }
    .item-en { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    .item-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .loading, .error, .empty {
      text-align: center; padding: 2rem; color: var(--muted);
    }
    .error { color: #dc2626; }
    .hidden { display: none !important; }

    /* 深色模式 */
    body.dark-theme {
      --bg: #0b0f17;
      --card: #141b27;
      --text: #e7ebf3;
      --muted: #8d98aa;
      --accent: #6ea8ff;
      --border: #293241;
      --drawer: #121925;
      --overlay: rgba(0, 0, 0, 0.55);
      background: radial-gradient(circle at 15% 0%, #151b28 0%, #0b0f17 42%, #05070b 100%);
      background-attachment: fixed;
    }
    body.dark-theme .item-icon { background: rgba(255,255,255,.04); }
    body.dark-theme .item-card:hover { border-color: #60a5fa; }
    body.dark-theme .menu-fab {
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    body.dark-theme .drawer {
      box-shadow: 4px 0 28px rgba(0,0,0,.45);
    }
    body.dark-theme .drawer-close:hover { background: rgba(255,255,255,.06); }
    body.dark-theme .drawer-nav a:hover,
    body.dark-theme .drawer-nav button:hover {
      background: rgba(110, 168, 255, 0.1);
      border-color: rgba(110, 168, 255, 0.3);
    }

    /* 左下角主題切換 */
    .theme-fab {
      position: fixed;
      bottom: 1rem;
      left: 0.85rem;
      z-index: 100;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .theme-fab:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.18);
    }
    body.dark-theme .theme-fab {
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <!-- 浮動選單按鈕 -->
  <button type="button" class="menu-fab" id="menu-fab" aria-label="開啟選單" onclick="openDrawer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>



  <!-- 遮罩 -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

  <!-- 左側滑出選單 -->
  <aside class="drawer" id="drawer" role="dialog" aria-label="選單">
    <div class="drawer-header">
      <span class="drawer-title">選單</span>
      <button type="button" class="drawer-close" aria-label="關閉" onclick="closeDrawer()">×</button>
    </div>
    <nav class="drawer-nav">
      <button type="button" id="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌛</span>
        <span id="theme-label">深色模式</span>
      </button>
      <a href="index.html" onclick="closeDrawer()">數值計算器</a>
    </nav>
  </aside>

  <div class="container">
    <h1>寶可夢道具圖鑑</h1>

    <div class="search-wrap">
      <input type="search" id="search" placeholder="搜尋道具名稱…" oninput="onSearch(this.value)" autocomplete="off">
    </div>

    <div id="content" class="loading">載入中…</div>
  </div>

  <script>
    const TARGET_SECTIONS = [
      { key: '攜帶物品', title: '攜帶物品' },
      { key: '超級石', title: '超級石' },
      { key: 'Ｚ純晶', title: 'Ｚ純晶' },
      { key: '樹果', title: '樹果' }
    ];

    let allSections = [];

    function openDrawer() {
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function findCategory(nodes, name) {
      if (!Array.isArray(nodes)) return null;
      for (const n of nodes) {
        if (!n || typeof n !== 'object') continue;
        if ((n.name || n.name_zh) === name) return n;
        const found = findCategory(n.children || [], name);
        if (found) return found;
      }
      return null;
    }

    function collectItems(node) {
      const items = [];
      if (!node) return items;
      if (node.type === 'item') {
        items.push(node);
        return items;
      }
      for (const c of node.children || []) {
        items.push(...collectItems(c));
      }
      return items;
    }

    function collectGroups(node) {
      const kids = node.children || [];
      const hasSubCat = kids.some(c => c && c.type === 'category');
      if (!hasSubCat) {
        return [{ subtitle: null, items: collectItems(node) }];
      }
      return kids
        .filter(c => c && c.type === 'category')
        .map(c => ({
          subtitle: c.name || c.name_zh || '',
          items: collectItems(c)
        }));
    }

    function iconSrc(icon) {
      if (!icon) return '';
      if (Array.isArray(icon)) icon = icon[0];
      if (typeof icon !== 'string') return '';
      return 'data/images/items/' + encodeURIComponent(icon);
    }

    function renderItem(item) {
      const name = item.name_zh || item.name || '—';
      const en = item.name_en || '';
      const desc = item.description || '';
      const src = iconSrc(item.icon);
      return `<div class="item-card" data-name="${escapeAttr(name)}" data-en="${escapeAttr(en)}">
        ${src ? `<img class="item-icon" src="${src}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<div class="item-icon"></div>'}
        <div class="item-body">
          <div class="item-name">${escapeHtml(name)}</div>
          ${en ? `<div class="item-en">${escapeHtml(en)}</div>` : ''}
          ${desc ? `<div class="item-desc">${escapeHtml(desc)}</div>` : ''}
        </div>
      </div>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }

    function render() {
      const root = document.getElementById('content');
      if (!allSections.length) {
        root.innerHTML = '<p class="empty">找不到指定分類</p>';
        return;
      }
      root.innerHTML = allSections.map(sec => {
        const total = sec.groups.reduce((n, g) => n + g.items.length, 0);
        const groupsHtml = sec.groups.map(g => {
          const cards = g.items.map(renderItem).join('');
          return `${g.subtitle ? `<div class="sub-title">${escapeHtml(g.subtitle)}</div>` : ''}
            <div class="item-grid">${cards || '<p class="empty">無道具</p>'}</div>`;
        }).join('');
        return `<section class="section" data-section="${escapeAttr(sec.title)}">
          <h2 class="section-title">${escapeHtml(sec.title)} <span class="count">(${total})</span></h2>
          ${groupsHtml}
        </section>`;
      }).join('');
    }

    function onSearch(q) {
      q = (q || '').trim().toLowerCase();
      document.querySelectorAll('.item-card').forEach(card => {
        const name = (card.dataset.name || '').toLowerCase();
        const en = (card.dataset.en || '').toLowerCase();
        const show = !q || name.includes(q) || en.includes(q);
        card.classList.toggle('hidden', !show);
      });
      document.querySelectorAll('.section').forEach(sec => {
        const visible = sec.querySelectorAll('.item-card:not(.hidden)').length;
        sec.classList.toggle('hidden', q && visible === 0);
      });
    }

    function updateThemeIcon() {
      const dark = document.body.classList.contains('dark-theme');
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      if (icon) icon.textContent = dark ? '☀️' : '🌛';
      if (label) label.textContent = dark ? '淺色模式' : '深色模式';
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const dark = document.body.classList.contains('dark-theme');
      localStorage.setItem('pokemon-calc-theme', dark ? 'dark' : 'light');
      updateThemeIcon();
    }

    function applyStoredTheme() {
      const t = localStorage.getItem('pokemon-calc-theme');
      if (t === 'dark') {
        document.body.classList.add('dark-theme');
      }
      updateThemeIcon();
    }

    async function init() {
      applyStoredTheme();
      // ESC 關閉選單
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer();
      });
      try {
        const res = await fetch('data/item_list.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allSections = [];
        for (const { key, title } of TARGET_SECTIONS) {
          const cat = findCategory(data, key);
          if (!cat) {
            console.warn('category not found:', key);
            continue;
          }
          allSections.push({
            title,
            groups: collectGroups(cat)
          });
        }
        render();
      } catch (err) {
        console.error(err);
        document.getElementById('content').innerHTML =
          `<p class="error">載入失敗：${escapeHtml(err.message)}。請用本地 HTTP 伺服器開啟（不要直接 file://）。</p>`;
      }
    }

    init();
  </script>
</body>
</html>
