<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢數值計算器</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #5c6b7a;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --weak-2: #ef4444;
      --weak-4: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1rem; font-weight: 700; }
    .main-info {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .info-left {
      flex: 1 1 280px;
      min-width: 0;
    }
    .info-right {
      flex: 0 0 240px;
      text-align: center;
    }
    @media (max-width: 640px) {
      .info-right { flex: 1 1 100%; order: -1; }
      .info-left { flex: 1 1 100%; }
    }
    .search-wrap { position: relative; margin-bottom: 1.25rem; }
    .search-input {
      width: 100%; padding: 0.75rem 1rem; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text);
    }
    .search-input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dropdown-list {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      max-height: 360px; overflow-y: auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 50;
    }
    .dropdown-list.open { display: block; }
    .dropdown-item { padding: 0.55rem 1rem; cursor: pointer; font-size: 0.95rem; }
    .dropdown-item:hover, .dropdown-item.active { background: #eff6ff; color: var(--accent); }
    .dropdown-empty { padding: 0.75rem 1rem; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card); border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1.25rem; margin-bottom: 1rem;
    }
    .image-area {
      text-align: center; min-height: 160px;
      display: flex; align-items: center; justify-content: center;
    }
    .image-area img { max-width: 220px; max-height: 220px; object-fit: contain; }

    .form-btns {
      display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center;
      margin-top: 0.75rem;
    }
    .form-btn {
      padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.8rem; color: var(--text);
    }
    .form-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .shiny-toggle {
      margin-top: 0.5rem; display: flex; justify-content: center;
    }
    .shiny-btn {
      padding: 0.3rem 0.9rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.8rem; color: var(--text);
    }
    .shiny-btn:hover { border-color: #a855f7; color: #7e22ce; }
    .shiny-btn.active {
      background: linear-gradient(135deg, #c084fc, #a855f7);
      color: #fff; border-color: #9333ea;
    }
    .ability-badge {
      display: inline-block; padding: 0.25rem 0.7rem; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; margin: 0.15rem 0.25rem 0.15rem 0;
      background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;
    }
    .ability-badge.ability-hidden {
      background: #f3e8ff; color: #7e22ce; border-color: #e9d5ff;
    }
    #abilities-area { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .ability-badge { cursor: help; position: relative; }
    .move-name-tip { cursor: help; border-bottom: 1px dashed #94a3b8; }
    body.dark-theme .move-name-tip { border-bottom-color: #64748b; }
    .ability-tooltip {
      position: fixed; z-index: 9999; max-width: 320px;
      background: #1e293b; color: #f1f5f9; padding: 0.75rem 1rem;
      border-radius: 10px; font-size: 0.85rem; line-height: 1.5;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); pointer-events: none;
      white-space: pre-wrap; display: none;
    }
    .ability-tooltip .tip-name {
      font-weight: 700; margin-bottom: 0.35rem; color: #93c5fd;
    }
    .ability-tooltip .tip-loading { color: #94a3b8; font-style: italic; }

    .info-right .image-area { min-height: 200px; }
    .placeholder { color: var(--muted); font-size: 0.95rem; }
    .section-title {
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.6rem;
    }
    .types { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .type-badge {
      padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.85rem;
      font-weight: 600; color: #fff; background: #64748b;
    }
    .type-一般 { background: #a8a878; }
    .type-火 { background: #f08030; }
    .type-水 { background: #6890f0; }
    .type-草 { background: #78c850; }
    .type-電, .type-电 { background: #f8d030; color: #333; }
    .type-冰 { background: #98d8d8; color: #333; }
    .type-格鬥, .type-格斗 { background: #c03028; }
    .type-毒 { background: #a040a0; }
    .type-地面 { background: #e0c068; color: #333; }
    .type-飛行, .type-飞行 { background: #a890f0; }
    .type-超能力 { background: #f85888; }
    .type-蟲, .type-虫 { background: #a8b820; }
    .type-岩石 { background: #b8a038; }
    .type-幽靈, .type-幽灵 { background: #705898; }
    .type-龍, .type-龙 { background: #7038f8; }
    .type-惡 { background: #705848; }
    .type-鋼, .type-钢 { background: #b8b8d0; color: #333; }
    .type-妖精 { background: #ee99ac; color: #333; }
    .weakness-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .weak-item {
      font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 6px;
      background: #fef2f2; color: var(--weak-2); border: 1px solid #fecaca;
    }
    .weak-item.x4 { background: #fee2e2; color: var(--weak-4); font-weight: 700; border-color: #fca5a5; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
    @media (min-width: 480px) { .stats-grid { grid-template-columns: repeat(6, 1fr); } }
    .stat-box { text-align: center; padding: 0.5rem; background: #f1f5f9; border-radius: 8px; }
    .stat-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.15rem; }
    .stat-value { font-size: 1.1rem; font-weight: 700; }
    .moves-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.35rem 0.8rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.85rem;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .moves-table-wrap { overflow-x: auto; max-height: 360px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.4rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; z-index: 2; background: #f8fafc; font-weight: 600; color: var(--muted); font-size: 0.75rem; }
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
    .error { color: #dc2626; text-align: center; padding: 1rem; }
    .name-line { text-align: center; margin-bottom: 0.5rem; }
    .name-zh { font-size: 1.35rem; font-weight: 700; }
    .name-sub { font-size: 0.85rem; color: var(--muted); }
    .note { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 0.5rem; }
    .calc-controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center;
      margin-bottom: 1rem; font-size: 0.9rem;
    }
    .calc-controls label { display: flex; align-items: center; gap: 0.4rem; }
    .calc-controls input[type="number"] {
      width: 4.2rem; padding: 0.3rem 0.4rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem;
    }
    .calc-controls select {
      padding: 0.3rem 0.5rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.85rem; max-width: 240px;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.75rem 1rem;
      align-items: start;
    }
    @media (max-width: 640px) {
      .calc-grid { grid-template-columns: 1fr; }
      .calc-col-result { order: -1; }
    }
    .calc-col {
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .calc-col-title {
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
      text-align: center; margin-bottom: 0.2rem;
    }
    .calc-row {
      display: flex; align-items: center; gap: 0.5rem;
      background: #f8fafc; border-radius: 10px; padding: 0.35rem 0.5rem;
    }
    .calc-row .stat-name {
      flex: 0 0 2.6rem; font-size: 0.8rem; font-weight: 600; text-align: center;
    }
    .calc-row input[type="range"] {
      flex: 1; min-width: 0; height: 6px; accent-color: var(--accent);
    }
    .calc-row input[type="number"] {
      width: 3.2rem; padding: 0.2rem 0.25rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.85rem; text-align: center;
    }
    .calc-col-result {
      min-width: 110px;
      background: #f1f5f9; border-radius: 12px; padding: 0.5rem;
      border: 1px solid var(--border);
    }
    .calc-result-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.35rem 0.5rem; border-radius: 8px; margin-bottom: 0.3rem;
      background: #fff;
    }
    .calc-result-item:last-child { margin-bottom: 0; }
    .calc-result-item .r-label { font-size: 0.8rem; color: var(--muted); }
    .calc-result-item .r-value { font-size: 1.05rem; font-weight: 700; }
    .calc-result-item.boost { background: #ecfdf5; }
    .calc-result-item.boost .r-value { color: #059669; }
    .calc-result-item.nerf { background: #fef2f2; }
    .calc-result-item.nerf .r-value { color: #dc2626; }
    .ev-total {
      font-size: 0.8rem; text-align: center; margin-top: 0.4rem;
      color: var(--muted);
    }
    .ev-total.over { color: #dc2626; font-weight: 600; }
    .calc-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.75rem; }
    .calc-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.75rem;
    }
    .calc-header .section-title { margin-bottom: 0; }
    .calc-actions { display: flex; gap: 0.4rem; }
    .calc-btn {
      padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.85rem; line-height: 1.2;
    }
    .calc-btn:hover { background: #f1f5f9; }
    .calc-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .calc-btn.primary:hover { filter: brightness(1.05); }
    .calc-btn.danger { color: #dc2626; }
    #calc-container { display: flex; flex-direction: column; gap: 1rem; }
    .calc-card-extra { border: 1px dashed #cbd5e1; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th.sortable .sort-ind { font-size: 0.7em; opacity: 0.6; margin-left: 2px; }

    .base-stat-total {
      margin-left: 0.5rem;
      font-size: 0.8em;
      font-weight: 500;
      color: #64748b;
    }
    /* 傷害計算：獨立拉寬並把雙方欄位固定對齊，避免滑桿、數值與標籤互相擠壓 */
    .damage-card { width: min(1200px, calc(100vw - 2rem)); margin-left: 50%; transform: translateX(-50%); }
    .damage-card .section-title { margin-bottom: 1rem; }
    .damage-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.8rem 1.5rem; align-items: center; margin-bottom: 1.15rem; font-size: 0.9rem; }
    .damage-controls label { display: flex; align-items: center; gap: 0.45rem; }
    .damage-controls select, .damage-controls input[type="number"] { padding: 0.42rem 0.6rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.88rem; background: #fff; }
    .damage-controls select { width: 260px; max-width: 70vw; }
    .damage-controls input[type="number"] { width: 4.2rem; text-align: center; }
    .damage-sides { display: grid; grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr); gap: 1rem; align-items: stretch; }
    .damage-side { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.05rem 0.9rem; min-width: 0; }
    .damage-copy-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 0.38rem 0.7rem;
      font-size: 0.84rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .damage-copy-btn:hover { border-color: var(--accent); color: var(--accent); }

    .damage-side-title { text-align: center; font-weight: 800; color: var(--text); margin-bottom: 0.6rem; font-size: 1.08rem; }
    .damage-side-head { text-align: center; margin-bottom: 0.9rem; }
    .damage-level-nature { display:flex; justify-content:center; align-items:center; gap:0.7rem; flex-wrap:wrap; margin:0.75rem 0 1rem; }
    .damage-level-nature label { display:flex; align-items:center; gap:0.4rem; font-size:0.9rem; font-weight:600; }
    .damage-level-nature input, .damage-level-nature select { padding:0.42rem 0.55rem; border:1px solid var(--border); border-radius:7px; background:#fff; font-size:0.9rem; }
    .damage-level-nature input { width:78px; }

    .damage-held-item {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 0 1rem;
    }
    .damage-held-item > label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      width: auto;
      max-width: none;
      margin: 0;
    }
    .damage-held-search {
      position: relative;
      width: 200px;
      flex: 0 0 200px;
    }
    .damage-held-input {
      width: 100%;
      padding: 0.42rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      font-size: 0.9rem;
      box-sizing: border-box;
      text-align: left;
    }
    .damage-held-dropdown {
      display: none;
      position: absolute;
      z-index: 1000;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      text-align: left;
    }
    .damage-held-dropdown.open { display: block; }
    .damage-held-item-opt { padding: 0.5rem 0.7rem; cursor: pointer; font-size: 0.88rem; }
    .damage-held-item-opt:hover { background: #eff6ff; color: var(--accent); }
    .damage-held-empty { padding: 0.5rem 0.7rem; color: var(--muted); font-size: 0.85rem; }
    body.dark-theme .damage-held-input {
      background: linear-gradient(180deg,#0e141e 0%,#090d14 100%);
      color: #e7ebf3;
      border-color: #303a4a;
    }
    body.dark-theme .damage-held-dropdown {
      background: #121925;
      border-color: #303a4a;
    }
    body.dark-theme .damage-held-item-opt:hover {
      background: #1a2230;
      color: #93c5fd;
    }
    .damage-side-image { width: 175px; height: 175px; object-fit: contain; display: block; margin: 0 auto 0.25rem; }
    .damage-side-name { text-align: center; font-size: 1.12rem; font-weight: 800; margin-bottom: 0.15rem; }
    .damage-side-sub { text-align: center; font-size: 0.84rem; color: var(--muted); min-height: 1.25em; }
    .damage-form-btns { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center; margin-top: 0.55rem; }
    .damage-form-btns .form-btn { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    .damage-adjust-grid { display: grid; grid-template-columns: 2.9rem minmax(65px, 1fr) 3.3rem minmax(65px, 1fr) 3.3rem 4.2rem 4.7rem; gap: 0.55rem 0.55rem; align-items: center; }
    .damage-adjust-title { font-size: 0.76rem; font-weight: 700; color: var(--muted); text-align: center; white-space: nowrap; }
    .damage-adjust-label { font-size: 0.82rem; font-weight: 700; text-align: left; white-space: nowrap; }
    .damage-adjust-grid input[type="range"] { width: 100%; min-width: 0; height: 6px; accent-color: var(--accent); margin: 0; cursor: grab; touch-action: none; user-select: none; }
    .damage-adjust-grid input[type="range"]:active { cursor: grabbing; }
    .damage-adjust-grid input[type="number"] { width: 100%; min-width: 0; box-sizing: border-box; padding: 0.36rem 0.25rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.82rem; text-align: center; background: #fff; }
    .damage-stat-current { display: inline-flex; justify-content: center; align-items: center; min-width: 0; width: 100%; padding: 0.36rem 0.35rem; border-radius: 8px; background: #fff; border: 1px solid var(--border); text-align: center; font-size: 0.84rem; font-weight: 800; }
    .damage-stat-stage { width: 100%; min-width: 0; box-sizing: border-box; padding: 0.36rem 0.2rem; border: 1px solid var(--border); border-radius: 8px; background:#fff; font-size:0.78rem; text-align:center; }
    .damage-ev-total { margin-top: 0.8rem; text-align: right; padding-right: 0.1rem; font-size: 0.78rem; color: var(--muted); }
    .damage-ev-total.over { color: #dc2626; font-weight: 700; }
    .damage-current-hp { display:flex; flex-direction:column; gap:0.4rem; margin-top:0.55rem; }
    .damage-current-hp-slider-row { display:flex; align-items:center; gap:0.6rem; }
    .damage-current-hp-slider-row input[type="range"] { flex:1; min-width:0; }
    .damage-current-hp-number { width:4.5rem; padding:0.32rem 0.4rem; border:1px solid var(--border); border-radius:6px; text-align:center; background:#fff; box-sizing:border-box; }
    .damage-current-hp { margin-top: 0.75rem; padding: 0.55rem 0.7rem; border: 1px solid var(--border); border-radius: 9px; background: #fff; }
    .damage-current-hp-head { display:flex; justify-content:space-between; align-items:center; gap:0.6rem; font-size:0.8rem; font-weight:700; margin-bottom:0.35rem; }
    .damage-current-hp-value { font-size:0.9rem; }
    .damage-current-hp input[type=range] { width:100%; margin:0; accent-color:var(--accent); cursor:grab; touch-action:none; }
    .damage-current-hp input[type=range]:active { cursor:grabbing; }
    .damage-swap { display: flex; justify-content: center; align-items: center; }
    .damage-swap button { width: 58px; height: 58px; border: 1px solid var(--border); border-radius: 50%; background: #fff; color: var(--text); cursor: pointer; font-size: 1.65rem; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .damage-swap button:hover { border-color: var(--accent); color: var(--accent); }
    .damage-move-controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 0.7rem; margin-top: 1rem; }
    .damage-move-controls label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.88rem; }
    .damage-move-controls select { max-width: 360px; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
    .damage-move-controls input[type="number"] { width: 4.5rem; padding: 0.35rem 0.45rem; border: 1px solid var(--border); border-radius: 6px; text-align: center; }
    .damage-bonus-wrap { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 1.2rem; margin-top: 0.85rem; }
    .damage-crit-inline, .damage-other-bonus { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.88rem; }
    .damage-other-bonus input[type="number"] { width: 4.8rem; padding: 0.35rem 0.45rem; border: 1px solid var(--border); border-radius: 6px; text-align: center; background: #fff; }
    .damage-calc-wrap { display: flex; justify-content: center; margin-top: 0.85rem; }
    .damage-calc-btn { border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); cursor: pointer; padding: 0.5rem 2.4rem; font-size: 0.9rem; }
    .damage-calc-btn:hover { border-color: var(--accent); color: var(--accent); }
    .damage-result { margin-top: 1rem; text-align: center; background: #f1f5f9; border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem; }
    .damage-result-label { color: var(--muted); font-size: 0.8rem; }

    .damage-hp-bar { position: relative; width: 100%; height: 28px; border: 1px solid #111827; border-radius: 9px; background: #fff; overflow: visible; box-sizing: border-box; }

    .damage-hp-range { position: absolute; top: 0; bottom: 0; }

    .damage-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.65rem; text-align: center; }

      .damage-adjust-grid { grid-template-columns: 2.6rem minmax(48px, 1fr) 2.9rem minmax(48px, 1fr) 2.9rem 3.6rem 3.9rem; gap: 0.45rem 0.35rem; }
      .damage-adjust-title { font-size: 0.68rem; }

    .discord-link:focus-visible {

    .damage-controls { display:flex; justify-content:center; align-items:center; gap:18px; flex-wrap:wrap; }
    .damage-controls label { display:flex; align-items:center; gap:8px; }

    /* 對象選單與下方左右兩個區塊使用完全相同的三欄網格，
       讓攻擊方選單正對攻擊方卡片、防禦方選單正對防禦方卡片。 */
    .damage-object-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.15rem;
      font-size: 0.9rem;

    .damage-object-controls label {
      display: flex;
      align-items: center;
      gap: 0.55rem;

    }
    .damage-object-controls label:first-child { justify-content: flex-end; }
    .damage-object-controls label:last-child { justify-content: flex-start; }
    .damage-object-controls select,
    .damage-pokemon-input {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 0.9rem;

    .damage-pokemon-search { position:relative; flex:1 1 auto; min-width:0; }
    .damage-pokemon-dropdown {

    .damage-pokemon-empty { padding:0.55rem 0.7rem; color:var(--muted); font-size:0.85rem; }
    @media (max-width: 760px) {
      .damage-object-controls {
        grid-template-columns: 1fr;
        gap: 0.65rem;

      .damage-object-controls label:first-child,

    .damage-crit-inline { display:inline-flex; align-items:center; gap:8px; margin-left:16px; font-weight:600; }

    .damage-weather-controls label { display:flex; flex-direction:column; align-items:flex-start; gap:0.35rem; font-size:0.95rem; font-weight:600; }
    .damage-weather-controls select { min-width:180px; padding:0.55rem 0.7rem; border:1px solid var(--border); border-radius:8px; background:#fff; font-size:0.95rem; }
    .damage-status-row {

    }
    .damage-status-row > label {

      align-items: flex-start;
      gap: 0.35rem;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .damage-status-search { position: relative; width: 240px; min-width: 220px; }
    .damage-status-btn {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      box-sizing: border-box;

    }
    .damage-status-btn:hover { border-color: var(--accent); }
    .damage-status-dropdown {
      display: none;
      position: absolute;
      z-index: 1000;
      left: 0;
      right: 0;
      top: calc(100% + 4px);

      max-height: 9.6rem;
      overflow-y: auto;

      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);

    }
    .damage-status-dropdown.open { display: block; }
    .damage-status-opt {
      padding: 0.48rem 0.7rem;
      cursor: pointer;
      font-size: 0.9rem;

      align-items: center;

      min-height: 2.15rem;

    .damage-status-opt:hover { background: #eff6ff; color: var(--accent); }
    .damage-status-opt .check { width: 1.1em; text-align: center; flex-shrink: 0; }
    body.dark-theme .damage-status-btn {
      background: linear-gradient(180deg,#0e141e 0%,#090d14 100%);

      border-color: #303a4a;

    body.dark-theme .damage-status-dropdown {
      background: #121925;
      border-color: #303a4a;
    }
    body.dark-theme .damage-status-opt:hover {
      background: #1a2230;
      color: #93c5fd;
    }
    .damage-status-panel {

    }
    .damage-status-panel-title {

      font-weight: 700;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .damage-status-list {
      max-height: 7.2rem; /* 約顯示 4 項 */
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    .damage-status-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.38rem 0.55rem;

      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #f1f5f9;
    }

    .damage-status-row:hover { background: #eff6ff; }
    .damage-status-row .check { width: 1.15em; text-align: center; flex-shrink: 0; }
    body.dark-theme .damage-status-list {
      background: #121925;
      border-color: #303a4a;
    }

      border-bottom-color: #1e293b;

    .damage-calc-wrap { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:18px; }

    /* ===== 全站 UI 美化 ===== */
    :root {
      --bg: #eef3f8;
      --card: rgba(255,255,255,.96);
      --text: #172033;
      --muted: #64748b;
      --accent: #4f7cff;
      --accent-2: #7c5cff;
      --border: #dbe3ee;
      --surface: #f6f8fc;
    }
    html { scroll-behavior: smooth; }
    body {
      background:
        radial-gradient(circle at 8% 0%, rgba(79,124,255,.10), transparent 28%),
        radial-gradient(circle at 92% 8%, rgba(124,92,255,.08), transparent 24%),
        linear-gradient(180deg, #f7f9fc 0%, var(--bg) 100%);
      padding: 1.25rem;
    }
    .container { max-width: 1080px; }
    h1 {
      font-size: clamp(1.65rem, 3vw, 2.15rem);
      letter-spacing: .02em;
      margin: .35rem 0 1.35rem;
      background: linear-gradient(135deg, #294a9b, #6d4bdc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid rgba(219,227,238,.9);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(31,48,78,.07), 0 2px 8px rgba(31,48,78,.04);
      padding: 1.35rem;
      margin-bottom: 1.15rem;
      backdrop-filter: blur(8px);
    }
    .card::before {
      content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px;
      border-radius: 0 4px 4px 0; background: linear-gradient(180deg, var(--accent), var(--accent-2));
      opacity: .75;
    }
    .section-title {
      color: #334155; font-size: .88rem; font-weight: 800; letter-spacing: .06em;
      text-transform: none; padding-bottom: .55rem; margin-bottom: .85rem;
      border-bottom: 1px solid #e8edf4;
    }
    .search-wrap { margin-bottom: 1.35rem; }
    .search-input, select, input[type="number"] {
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .search-input {
      border: 1px solid #d5deea; border-radius: 12px;
      padding: .8rem 1rem; box-shadow: 0 4px 12px rgba(31,48,78,.04);
    }
    .search-input:hover { border-color: #b8c7dc; }
    .search-input:focus, select:focus, input[type="number"]:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,124,255,.13);
    }
    .dropdown-list, .damage-pokemon-dropdown {
      border-color: #d6dfeb; border-radius: 12px;
      box-shadow: 0 18px 40px rgba(22,34,56,.14);
    }
    .dropdown-item, .damage-pokemon-item { transition: background .12s ease, padding-left .12s ease; }
    .dropdown-item:hover, .dropdown-item.active, .damage-pokemon-item:hover {
      background: #f0f5ff; color: #315fd1; padding-left: 1.05rem;
    }
    .image-area { min-height: 175px; }
    .info-right .image-area { min-height: 215px; }
    .image-area img { filter: drop-shadow(0 12px 12px rgba(36,52,80,.13)); transition: transform .2s ease; }
    .image-area img:hover { transform: translateY(-3px) scale(1.02); }
    .name-zh { font-size: 1.45rem; letter-spacing: .02em; }
    .name-sub { color: #7b8798; }
    .type-badge { box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 2px 5px rgba(0,0,0,.08); }
    .stats-grid { gap: .7rem; }
    .stat-box {
      background: linear-gradient(180deg, #f8faff, #f0f4f9);
      border: 1px solid #e3eaf3; border-radius: 11px; padding: .62rem .45rem;
    }
    .stat-value { color: #1f2f4d; }
    .form-btn, .shiny-btn, .tab-btn, .calc-btn, .damage-copy-btn {
      border-color: #d6dfeb; border-radius: 9px;
      box-shadow: 0 1px 2px rgba(31,48,78,.03);
      transition: all .16s ease;
    }
    .form-btn:hover, .shiny-btn:hover, .tab-btn:hover, .calc-btn:hover, .damage-copy-btn:hover {
      transform: translateY(-1px); box-shadow: 0 4px 10px rgba(31,48,78,.08);
    }
    .form-btn.active, .tab-btn.active {
      background: linear-gradient(135deg, #4f7cff, #667eea);
      border-color: #4f7cff; box-shadow: 0 5px 12px rgba(79,124,255,.2);
    }
    .calc-btn.primary, .damage-calc-btn {
      background: linear-gradient(135deg, #4f7cff, #6c63e8);
      color: #fff; border-color: transparent;
      box-shadow: 0 6px 14px rgba(79,124,255,.22);
    }
    .calc-btn.primary:hover, .damage-calc-btn:hover {
      filter: brightness(1.04); transform: translateY(-1px);
    }
    .calc-row, .damage-side {
      background: linear-gradient(180deg, #f9fbfd, #f4f7fb);
      border-color: #e0e7f0;
    }
    .calc-result-item, .damage-current-hp {
      border: 1px solid #e3e9f1; box-shadow: 0 2px 6px rgba(31,48,78,.035);
    }
    .damage-card {
      border-radius: 20px;
      box-shadow: 0 14px 38px rgba(31,48,78,.09);
    }
    .damage-side { border-radius: 16px; padding: 1.05rem 1.1rem .95rem; }
    .damage-swap button {
      background: linear-gradient(145deg, #fff, #f1f5fb);
      border-color: #d4deeb; box-shadow: 0 8px 18px rgba(31,48,78,.09);
      transition: all .18s ease;
    }
    .damage-swap button:hover { transform: scale(1.06); color: #4f7cff; border-color: #aebfe0; }
    .damage-side-image { filter: drop-shadow(0 10px 12px rgba(31,48,78,.12)); }
    .damage-adjust-grid input[type="range"], .damage-current-hp input[type="range"] {
      accent-color: #5b7ff5;
    }
    .damage-stat-stage, .damage-stat-current, .damage-adjust-grid input[type="number"],
    .damage-current-hp-number, .damage-move-controls select, .damage-move-controls input[type="number"] {
      border-color: #d5dfeb; background: #fff;
    }
    .damage-hp-bar {
      height: 30px; border: 1px solid #cbd5e1; border-radius: 10px;
      box-shadow: inset 0 1px 3px rgba(15,23,42,.10), 0 3px 8px rgba(31,48,78,.05);
    }
    .damage-hp-range-min { background: linear-gradient(90deg, #9ee7a8, #bff2c5); }
    .damage-hp-range-max { background: linear-gradient(90deg, #f2aaaa, #f8c5c5); }
    .damage-guaranteed-hits::before {
      background: #fff; border-color: #334155; box-shadow: 0 2px 6px rgba(31,48,78,.16);
    }
    .damage-result {
      background: linear-gradient(135deg, #f4f7ff, #f7f5ff);
      border-color: #dfe5f1; box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .damage-result-value { color: #243b78; }
    .moves-table-wrap { border: 1px solid #e2e8f0; border-radius: 11px; }
    th { background: #f4f7fb; }
    tr:hover td { background: #fafcff; }
    .discord-link { border-radius: 9px; box-shadow: 0 4px 10px rgba(88,101,242,.2); }
    @media (max-width: 760px) {
      body { padding: .7rem; }
      .card { padding: 1rem; border-radius: 15px; }
      .damage-card { width: calc(100vw - 1rem); }
    }

          const idx = p.index.toLowerCase();
          const name = (p.name_zh || '').toLowerCase();
          return idx.includes(q) || name.includes(q) ||

        `<div class="dropdown-item" data-index="${p.index}" data-i="${i}">${p.index} - ${p.name_zh}</div>`

    function calcStat(base, iv, ev, level, isHP, natureMod) {
      const term = Math.floor((base * 2 + iv + Math.floor(ev / 4)) * level / 100);
      if (isHP) return term + level + 10;
      return Math.floor((term + 5) * natureMod);
    }

    function getNatureMod(nature, key) {
      if (!nature || !nature.boost) return 1.0;

      return Math.max(min, Math.min(max, v));

    function getFinalStat(cid, key) {
      if (!currentData || !currentData.stats) return 0;
      const baseMap = currentBaseStats && Object.keys(currentBaseStats).length
        ? currentBaseStats
        : ((currentData.stats[0] && currentData.stats[0].data) || {});
      const base = parseInt(baseMap[key], 10) || 0;
      const level = getNum(`calc-level-${cid}`, 50, 1, 100);
      const natureIdx = getNum(`calc-nature-${cid}`, 0, 0, NATURES.length - 1);
      const nature = NATURES[natureIdx];
      const iv = getNum(`iv-${cid}-${key}`, 31, 0, 31);

      const isShedinja = (currentData.name_zh || "").includes("脫殼忍者") ||
                         (currentData.pokedex_id === "0292") ||
                         (currentData.name_en || "").toLowerCase() === "shedinja";
      if (key === "hp" && isShedinja) return 1;
      const mod = key === "hp" ? 1.0 : getNatureMod(nature, key);
      return calcStat(base, iv, ev, level, key === "hp", mod);
    }

    // 自動血防調整：把剩餘努力值（以4為單位）分配到 HP / 防禦 / 特防
    // 目標：最大化「物理耐久 + 特殊耐久」= HP×Def + HP×SpD
    // （參考傷害公式中 攻擊/防禦 與 特攻/特防 的對稱性，讓兩邊 bulk 都提升）
    function autoBulk(cid) {
      if (!currentData) return;
      const isShedinja = (currentData.name_zh || "").includes("脫殼忍者") ||
                         (currentData.pokedex_id === "0292") ||
                         (currentData.name_en || "").toLowerCase() === "shedinja";
      if (isShedinja) {
        // 脫殼忍者 HP 固定，只把剩餘點分給 Def / SpD
        // 仍用相同邏輯
      }

      // 先讀取目前非血防的 EV，計算剩餘
      let used = 0;
      STAT_KEYS.forEach(k => { used += getNum(`ev-${cid}-${k}`, 0, 0, 252); });
      let remaining = 510 - used;
      if (remaining < 4) {
        alert("剩餘努力值不足 4 點，無法再分配。");
        return;
      }

      // 貪心：每次加 4 點到能讓 score = HP*(Def + SpD) 提升最多的那個
      const targets = isShedinja ? ["defense", "sp_defense"] : ["hp", "defense", "sp_defense"];

      while (remaining >= 4) {
        // 讀取「當前」已調整後的最終能力值（包含使用者手動拉過的 EV）
        const curHp = getFinalStat(cid, "hp");
        const curDef = getFinalStat(cid, "defense");
        const curSpd = getFinalStat(cid, "sp_defense");
        const phys = curHp * curDef;   // 物理耐久
        const spec = curHp * curSpd;   // 特殊耐久

        // 根據目前哪邊較弱，決定優先加的方向
        // 若物理較弱 → 優先考慮防禦或 HP
        // 若特殊較弱 → 優先考慮特防或 HP
        // 若相等 → 三者都可
        let preferred;
        if (phys < spec) {
          preferred = ["defense", "hp", "sp_defense"];
        } else if (spec < phys) {
          preferred = ["sp_defense", "hp", "defense"];
        } else {
          preferred = ["hp", "defense", "sp_defense"];
        }

        // 只保留實際還能加的目標
        preferred = preferred.filter(k => {
          const ev = getNum(`ev-${cid}-${k}`, 0, 0, 252);
          return targets.includes(k) && ev + 4 <= 252;
        });

        if (preferred.length === 0) break;

        let bestKey = null;
        let bestMin = -1;
        let bestSum = -1;
        let bestEv = 0;

        for (const key of preferred) {
          const curEv = getNum(`ev-${cid}-${key}`, 0, 0, 252);

          // 暫時加 4 並計算新耐久
          const el = document.getElementById(`ev-${cid}-${key}`);
          const range = document.getElementById(`ev-range-${cid}-${key}`);
          if (!el) continue;
          el.value = curEv + 4;
          if (range) range.value = curEv + 4;

          const newHp = getFinalStat(cid, "hp");
          const newDef = getFinalStat(cid, "defense");
          const newSpd = getFinalStat(cid, "sp_defense");
          const newPhys = newHp * newDef;
          const newSpec = newHp * newSpd;
          const newMin = Math.min(newPhys, newSpec);
          const newSum = newPhys + newSpec;

          // 還原
          el.value = curEv;
          if (range) range.value = curEv;

          if (newMin > bestMin || (newMin === bestMin && newSum > bestSum)) {
            bestMin = newMin;
            bestSum = newSum;
            bestKey = key;
            bestEv = curEv + 4;
          }
        }

        // 若因 flooring 導致分數都沒變，仍強制選第一個可加的（確保剩餘點數會被用完）
        if (!bestKey) {
          bestKey = preferred[0];
          bestEv = getNum(`ev-${cid}-${bestKey}`, 0, 0, 252) + 4;
        }

        // 真正加上
        const el = document.getElementById(`ev-${cid}-${bestKey}`);
        const range = document.getElementById(`ev-range-${cid}-${bestKey}`);
        if (el) el.value = bestEv;
        if (range) range.value = bestEv;
        remaining -= 4;
      }

      updateCalcResults(cid);
    }

    function positionTip(e) {
      const el = ensureTipEl();
      const pad = 12;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      el.style.display = 'block';
      const rect = el.getBoundingClientRect();
      if (x + rect.width > window.innerWidth - 8) x = e.clientX - rect.width - pad;
      if (y + rect.height > window.innerHeight - 8) y = e.clientY - rect.height - pad;
      el.style.left = Math.max(8, x) + 'px';
      el.style.top = Math.max(8, y) + 'px';
    }

          if (!res.ok) throw new Error('not found');
          data = await res.json();

        // 招式表排序狀態
    let currentMovesSort = { key: null, dir: 1 }; // dir: 1 asc, -1 desc
    let currentMovesList = [];
    let currentMovesTab = 'learnable';

    const TYPE_ORDER = ['一般','火','水','草','電','冰','格鬥','毒','地面','飛行','超能力','蟲','岩石','幽靈','龍','惡','鋼','妖精'];
    const CAT_ORDER = { '物理': 0, '特殊': 1, '變化': 2 };

    function numOrNeg(v) {
      if (v === null || v === undefined || v === '' || v === '—' || v === '-') return -1;
      const n = parseFloat(v);
      return isNaN(n) ? -1 : n;
    }

    function sortMovesList(list, key, dir) {
      const arr = list.slice();
      arr.sort((a, b) => {
        let va, vb;
        if (key === 'type') {
          va = TYPE_ORDER.indexOf(a.type || '');
          vb = TYPE_ORDER.indexOf(b.type || '');
          if (va < 0) va = 999;
          if (vb < 0) vb = 999;
        } else if (key === 'category') {
          va = CAT_ORDER[a.category] ?? 9;
          vb = CAT_ORDER[b.category] ?? 9;
        } else if (key === 'power') {
          va = numOrNeg(a.power);
          vb = numOrNeg(b.power);
          // 高威力優先 → 我們用 desc 為預設
        } else if (key === 'accuracy') {
          va = numOrNeg(a.accuracy);
          vb = numOrNeg(b.accuracy);
        } else if (key === 'level') {
          va = numOrNeg(a.level);
          vb = numOrNeg(b.level);
        } else {
          return 0;
        }
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        // 次要：等級
        const la = numOrNeg(a.level), lb = numOrNeg(b.level);
        return la - lb;
      });
      return arr;
    }

    function filterDamageHeldItem(sideKey, text, syncClear) {
      const box = document.getElementById(`damage-${sideKey}-item-dropdown`);
      if (!box) return;
      const q = String(text || '').trim().toLowerCase();
      // 輸入框清空時，同步回到「無」
      if (syncClear && !q) {
        const sides = getDamageSides();
        if (sides?.[sideKey]) sides[sideKey].item = '';
        damageState.result = null;
      }
      let matched = DAMAGE_HELD_ITEMS;
      if (q) {
        matched = DAMAGE_HELD_ITEMS.filter(it => {
          const name = String(it.name || '').toLowerCase();
          const id = String(it.id || '').toLowerCase();
          // 「無」可用 無 / (無) / （無） 搜到
          if (!it.id && (q === '無' || q.includes('無'))) return true;
          return name.includes(q) || id.includes(q);
        });
        // 搜尋時仍把「（無）」固定放最上面，方便切回
        const noneItem = DAMAGE_HELD_ITEMS[0];
        if (!matched.some(x => !x.id)) {
          matched = [noneItem, ...matched];
        } else {
          matched = [noneItem, ...matched.filter(x => x.id)];
        }
      }
      if (!matched.length) {
        box.innerHTML = '<div class="damage-held-empty">沒有符合的道具</div>';

          selectDamageHeldItem(sideKey, first.getAttribute('data-id') || '');

    // 進化奇石：僅當該寶可夢在 evolution_chains 中「還能再進化」時生效。
    // 判斷：其名稱出現在任一進化節點的 from 欄位（表示後面還有下一階段）。
    function canStillEvolve(data, formLabel) {
      if (!data) return false;
      const names = new Set();
      const baseName = data.name_zh || data.name || '';
      if (baseName) names.add(baseName);
      // 表單名稱也可能出現在鏈上（例如地區型態）
      if (formLabel && formLabel !== '一般') names.add(formLabel);
      if (Array.isArray(data.forms)) {
        data.forms.forEach(f => { if (f && f.name) names.add(f.name); });
      }
      const chains = data.evolution_chains || [];
      for (const chain of chains) {
        if (!Array.isArray(chain)) continue;
        for (const node of chain) {
          if (!node) continue;
          const from = node.from;
          if (from && names.has(from)) return true;
        }
      }
      return false;
    }

    function applyHeldItemModifiers(ctx) {
      let { power, attack, defense, effectiveness, isSpecial, moveType, moveName } = ctx;
      const atkItem = getHeldItemDef(ctx.atkItemId);
      const defItem = getHeldItemDef(ctx.defItemId);
      const notes = [];

      if (atkItem.kind === 'power') {
        power = Math.floor(power * atkItem.mult);
        notes.push(atkItem.name + ' 威力×' + atkItem.mult);
      } else if (atkItem.kind === 'atk_stat' && !isSpecial) {
        attack = Math.floor(attack * atkItem.mult);
        notes.push(atkItem.name + ' 攻擊×' + atkItem.mult);
      } else if (atkItem.kind === 'spa_stat' && isSpecial) {
        attack = Math.floor(attack * atkItem.mult);
        notes.push(atkItem.name + ' 特攻×' + atkItem.mult);
      } else if (atkItem.kind === 'se_power' && effectiveness > 1) {
        power = Math.floor(power * atkItem.mult);
        notes.push(atkItem.name + ' 效果絕佳威力×' + atkItem.mult);
      } else if (atkItem.kind === 'type_power' && moveType === atkItem.type) {
        power = Math.floor(power * atkItem.mult);
        notes.push(atkItem.name + ' ' + atkItem.type + '威力×' + atkItem.mult);
      } else if (atkItem.kind === 'punch_power') {
        const n = String(moveName || '');
        if (PUNCH_MOVE_NAMES.has(n) || n.includes('拳')) {
          power = Math.floor(power * atkItem.mult);
          notes.push(atkItem.name + ' 拳頭威力×' + atkItem.mult);
        }
      }

      if (defItem.kind === 'spd_stat' && isSpecial) {
        defense = Math.floor(defense * defItem.mult);
        notes.push(defItem.name + ' 特防×' + defItem.mult);
      } else if (defItem.kind === 'def_spd_stat') {
        // 進化奇石：必須還能再進化才有效
        if (canStillEvolve(ctx.defData, ctx.defForm)) {
          defense = Math.floor(defense * defItem.mult);
          notes.push(defItem.name + ' 防禦/特防×' + defItem.mult);
        } else {
          notes.push(defItem.name + '（已最終進化，無效）');
        }
      } else if (defItem.kind === 'def_stat' && !isSpecial) {
        defense = Math.floor(defense * defItem.mult);
        notes.push(defItem.name + ' 防禦×' + defItem.mult);
      } else if (defItem.kind === 'type_resist' && moveType === defItem.type) {
        // 屬性減半樹果：效果絕佳時（燈漿果為一般屬性任意命中）觸發，威力減半
        const isChilan = !!defItem.any_hit;
        if (isChilan || effectiveness > 1) {
          power = Math.floor(power * defItem.mult);
          notes.push(defItem.name + ' ' + defItem.type + '威力×' + defItem.mult);
        }
      }

      return { power, attack, defense, notes };
    }


    function damageSafeText(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function getBaseStatsForForm(data, formLabel) {
      const entry = findStatsEntry(formLabel, data);
      return { ...((entry && entry.data) || (data && data.stats && data.stats[0] && data.stats[0].data) || {}) };
    }

    function getNeutralNature() { return NATURES.find(n => !n.boost) || NATURES[0]; }

    function cloneStatMap(src, fallback) {
      const out = {};
      STAT_KEYS.forEach(k => out[k] = Number.isFinite(Number(src?.[k])) ? Number(src[k]) : fallback);
      return out;
    }

    function calcSideStats(side) {
      const base = side.baseStats || {};
      const level = Math.max(1, Math.min(100, parseInt(side.level, 10) || 50));
      const nature = side.nature || getNeutralNature();
      const isShedinja = (side.name || side.data?.name_zh || '').includes('脫殼忍者') ||
                         (side.index || side.data?.pokedex_id || '') === '0292' ||
                         (side.data?.name_en || '').toLowerCase() === 'shedinja';
      const stats = {};
      STAT_KEYS.forEach(k => {
        // 與上方「能力值計算」一致：脫殼忍者 HP 永遠固定為 1。
        if (k === 'hp' && isShedinja) {
          stats[k] = 1;
          return;
        }
        const iv = Math.max(0, Math.min(31, parseInt((side.iv || {})[k], 10) || 0));
        const ev = Math.max(0, Math.min(252, parseInt((side.ev || {})[k], 10) || 0));
        const mod = k === 'hp' ? 1 : getNatureMod(nature, k);
        stats[k] = calcStat(parseInt(base[k], 10) || 0, iv, ev, level, k === 'hp', mod);
      });
      return stats;
    }

    function readCalcSideInputs() {
      const iv = {}, ev = {};
      STAT_KEYS.forEach(k => {
        iv[k] = getNum(`iv-0-${k}`, 31, 0, 31);
        ev[k] = getNum(`ev-0-${k}`, 0, 0, 252);
      });
      return { iv, ev };
    }

      const nature = NATURES[natureIdx] || getNeutralNature();

        data: currentData,
        form: currentFormLabel,
        name: currentData?.name_zh || '攻擊方',

        stages: { hp:0, attack:0, defense:0, sp_attack:0, sp_defense:0, speed:0 },
        source: 'calc'

          const name = String(p.name_zh || '').toLowerCase();
