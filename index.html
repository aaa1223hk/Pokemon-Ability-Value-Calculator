<head>

  <style>

      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1rem; font-weight: 700; }
    .search-wrap { position: relative; margin-bottom: 1.25rem; }
    .search-input {
      width: 100%; padding: 0.75rem 1rem; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text);
    }
    .search-input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dropdown-list {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      max-height: 280px; overflow-y: auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 50;
    }
    .dropdown-list.open { display: block; }
    .dropdown-item { padding: 0.55rem 1rem; cursor: pointer; font-size: 0.95rem; }
    .dropdown-item:hover, .dropdown-item.active { background: #eff6ff; color: var(--accent); }
    .dropdown-empty { padding: 0.75rem 1rem; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card); border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1.25rem; margin-bottom: 1rem;
    }
    .image-area {
      text-align: center; min-height: 180px;
      display: flex; align-items: center; justify-content: center;
    }
    .image-area img { max-width: 220px; max-height: 220px; object-fit: contain; }
    .placeholder { color: var(--muted); font-size: 0.95rem; }
    .section-title {
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.6rem;
    }
    .types { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .type-badge {
      padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.85rem;
      font-weight: 600; color: #fff; background: #64748b;
    }
    .type-一般 { background: #a8a878; }
    .type-火 { background: #f08030; }
    .type-水 { background: #6890f0; }
    .type-草 { background: #78c850; }
    .type-電, .type-电 { background: #f8d030; color: #333; }
    .type-冰 { background: #98d8d8; color: #333; }
    .type-格鬥, .type-格斗 { background: #c03028; }
    .type-毒 { background: #a040a0; }
    .type-地面 { background: #e0c068; color: #333; }
    .type-飛行, .type-飞行 { background: #a890f0; }
    .type-超能力 { background: #f85888; }
    .type-蟲, .type-虫 { background: #a8b820; }
    .type-岩石 { background: #b8a038; }
    .type-幽靈, .type-幽灵 { background: #705898; }
    .type-龍, .type-龙 { background: #7038f8; }
    .type-惡 { background: #705848; }
    .type-鋼, .type-钢 { background: #b8b8d0; color: #333; }
    .type-妖精 { background: #ee99ac; color: #333; }
    .weakness-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .weak-item {
      font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 6px;
      background: #fef2f2; color: var(--weak-2); border: 1px solid #fecaca;
    }
    .weak-item.x4 { background: #fee2e2; color: var(--weak-4); font-weight: 700; border-color: #fca5a5; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
    @media (min-width: 480px) { .stats-grid { grid-template-columns: repeat(6, 1fr); } }
    .stat-box { text-align: center; padding: 0.5rem; background: #f1f5f9; border-radius: 8px; }
    .stat-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.15rem; }
    .stat-value { font-size: 1.1rem; font-weight: 700; }
    .moves-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.35rem 0.8rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.85rem;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .moves-table-wrap { overflow-x: auto; max-height: 360px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.4rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; background: #f8fafc; font-weight: 600; color: var(--muted); font-size: 0.75rem; }
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
    .error { color: #dc2626; text-align: center; padding: 1rem; }
    .name-line { text-align: center; margin-bottom: 0.5rem; }
    .name-zh { font-size: 1.35rem; font-weight: 700; }
    .name-sub { font-size: 0.85rem; color: var(--muted); }
    .note { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 0.5rem; }
  </style>
</head>

999.png", "1000": "1000.png", "1001": "1001.png", "1002": "1002.png", "1003": "1003.png", "1004": "1004.png", "1005": "1005.png", "1006": "1006.png", "1007": "1007.png", "1008": "1008.png", "1009": "1009.png", "1010": "1010.png", "1011": "1011.png", "1012": "1012.png", "1013": "1013.png", "1014": "1014.png", "1015": "1015.png", "1016": "1016.png", "1017": "1017.png", "1018": "1018.png", "1019": "1019.png", "1020": "1020.png", "1021": "1021.png", "1022": "1022.png", "1023": "1023.png", "1024": "1024.png", "1025": "1025.png"};

    const searchInput = document.getElementById('pokemon-search');
    const dropdownList = document.getElementById('dropdown-list');
    const contentEl = document.getElementById('content');

    const pokedex = EMBEDDED_POKEDEX;
    const indexToPokemon = EMBEDDED_POKE_MAP;
    const indexToImage = EMBEDDED_IMG_MAP;
    let selectedIndex = null;
    let activeIdx = -1;
    let currentData = null;

    function buildDropdownItems(filterText = '') {
      const q = (filterText || '').trim().toLowerCase();
      let matched = pokedex;
      if (q) {
        matched = pokedex.filter(p => {
          const idx = p.index.toLowerCase();
          const name = (p.name_zh || '').toLowerCase();
          return idx.includes(q) || name.includes(q) ||
                 idx.replace(/^0+/, '').startsWith(q.replace(/^0+/, ''));
        });
      }
      const show = matched.slice(0, 80);
      if (!show.length) {
        dropdownList.innerHTML = '<div class="dropdown-empty">沒有符合的寶可夢</div>';
        return;
      }
      dropdownList.innerHTML = show.map((p, i) =>
        `<div class="dropdown-item" data-index="${p.index}" data-i="${i}">${p.index} - ${p.name_zh}</div>`
      ).join('');
    }

    function openDropdown() { dropdownList.classList.add('open'); activeIdx = -1; }
    function closeDropdown() { dropdownList.classList.remove('open'); activeIdx = -1; }

    function selectPokemon(index) {
      const p = pokedex.find(x => x.index === index);
      if (!p) return;
      selectedIndex = index;
      searchInput.value = `${p.index} - ${p.name_zh}`;
      closeDropdown();
      loadPokemon(index);
    }

    searchInput.addEventListener('input', () => {
      selectedIndex = null;
      buildDropdownItems(searchInput.value);
      openDropdown();
    });
    searchInput.addEventListener('focus', () => {
      buildDropdownItems(searchInput.value);
      openDropdown();
    });
    searchInput.addEventListener('keydown', (e) => {
      const items = [...dropdownList.querySelectorAll('.dropdown-item')];
      if (!items.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
        items[activeIdx]?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
        items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
        items[activeIdx]?.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIdx >= 0 && items[activeIdx]) selectPokemon(items[activeIdx].dataset.index);
        else if (items.length === 1) selectPokemon(items[0].dataset.index);
      } else if (e.key === 'Escape') closeDropdown();
    });
    dropdownList.addEventListener('click', (e) => {
      const item = e.target.closest('.dropdown-item');
      if (item) selectPokemon(item.dataset.index);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) closeDropdown();
    });

    function typeClass(t) { return 'type-' + t; }

    function renderWeaknesses(teData) {
      if (!teData || !teData.length) return '<p class="placeholder">無弱點資料</p>';
      const data = teData[0].data || [];
      const weak = data.filter(d => parseFloat(d.damage) > 1);
      if (!weak.length) return '<p class="placeholder">無特別弱點</p>';
      return `<div class="weakness-grid">${weak.map(d => {
        const mul = parseFloat(d.damage);
        const cls = mul >= 4 ? 'x4' : 'x2';
        return `<span class="weak-item ${cls}">${d.type} ×${mul}</span>`;
      }).join('')}</div>`;
    }

    function renderStats(stats) {
      if (!stats || !stats.length) return '<p class="placeholder">無種族值</p>';
      const s = stats[0].data || {};
      const labels = { hp: 'HP', attack: '攻擊', defense: '防禦', sp_attack: '特攻', sp_defense: '特防', speed: '速度' };
      return `<div class="stats-grid">${Object.entries(labels).map(([k, lab]) =>
        `<div class="stat-box"><div class="stat-label">${lab}</div><div class="stat-value">${s[k] ?? '—'}</div></div>`
      ).join('')}</div>`;
    }

    function renderMovesTable(moves, formIndex = 0) {
      if (!moves || !moves.length) return '<p class="placeholder">無招式資料</p>';
      const list = (moves[formIndex] && moves[formIndex].data) ? moves[formIndex].data : (Array.isArray(moves) ? moves : []);
      if (!list.length) return '<p class="placeholder">無招式</p>';
      return `<div class="moves-table-wrap"><table>
        <thead><tr><th>等級</th><th>招式</th><th>屬性</th><th>分類</th><th>威力</th><th>命中</th><th>PP</th></tr></thead>
        <tbody>${list.map(m => `<tr>
          <td>${m.level ?? '—'}</td><td>${m.name ?? '—'}</td>
          <td><span class="type-badge ${typeClass(m.type || '')}" style="font-size:0.75rem;padding:0.1rem 0.4rem">${m.type || '—'}</span></td>
          <td>${m.category ?? '—'}</td><td>${m.power ?? '—'}</td><td>${m.accuracy ?? '—'}</td><td>${m.pp ?? '—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
      const area = document.getElementById('moves-area');
      if (!currentData || !area) return;
      if (tab === 'learnable') area.innerHTML = renderMovesTable(currentData.learnable_moves);
      else if (tab === 'machine') area.innerHTML = renderMovesTable(currentData.machine_moves);
      else if (tab === 'egg') area.innerHTML = renderMovesTable(currentData.egg_moves);
    }

    async function loadPokemon(index) {
      if (!index) {
        contentEl.innerHTML = `<div class="card image-area"><p class="placeholder">輸入或選擇寶可夢以顯示資料</p></div>`;
        return;
      }

      contentEl.innerHTML = `<div class="card loading">載入中…</div>`;

      const pokeFile = indexToPokemon[index];
      // 圖片：優先用映射，否則直接用編號.png（改名後的簡單規則）
      const imgFile = indexToImage[index] || (index + '.png');
      const imgSrc = `data/images/home/${imgFile}`;

      if (!pokeFile) {
        contentEl.innerHTML = `<div class="card error">找不到編號 ${index} 的資料檔映射。</div>`;
        return;
      }

      try {
        const res = await fetch(`data/pokemon/${pokeFile}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentData = data;

        const nameZh = data.name_zh || (pokedex.find(p => p.index === index) || {}).name_zh || index;
        const nameEn = data.name_en || '';
        const nameJa = data.name_ja || data.name_jp || '';
        const types = (data.type_effectiveness && data.type_effectiveness[0] && data.type_effectiveness[0].types) || [];

        contentEl.innerHTML = `
          <div class="card">
            <div class="image-area">
              <img src="${imgSrc}" alt="${nameZh}"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
              <p class="placeholder" style="display:none">圖片載入失敗（${imgFile}）</p>
            </div>
            <div class="name-line">
              <div class="name-zh">${nameZh}</div>
              <div class="name-sub">${nameEn}${nameJa ? ' / ' + nameJa : ''}</div>
            </div>
          </div>
          <div class="card">
            <div class="section-title">屬性</div>
            <div class="types">
              ${types.length ? types.map(t => `<span class="type-badge ${typeClass(t)}">${t}</span>`).join('') : '<span class="placeholder">—</span>'}
            </div>
            <div class="section-title" style="margin-top:0.75rem">弱點（受到傷害倍率）</div>
            ${renderWeaknesses(data.type_effectiveness)}
          </div>
          <div class="card">
            <div class="section-title">種族值</div>
            ${renderStats(data.stats)}
          </div>
          <div class="card">
            <div class="section-title">招式表</div>
            <div class="moves-tabs">
              <button class="tab-btn active" data-tab="learnable" onclick="switchTab('learnable')">升級習得</button>
              <button class="tab-btn" data-tab="machine" onclick="switchTab('machine')">招式機</button>
              <button class="tab-btn" data-tab="egg" onclick="switchTab('egg')">遺傳招式</button>
            </div>
            <div id="moves-area">${renderMovesTable(data.learnable_moves)}</div>
          </div>
        `;
      } catch (e) {
        // 即使詳細資料載入失敗，仍嘗試顯示圖片 + 名稱
        const p = pokedex.find(x => x.index === index) || {};
        contentEl.innerHTML = `
          <div class="card">
            <div class="image-area">
              <img src="${imgSrc}" alt="${p.name_zh || index}"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
              <p class="placeholder" style="display:none">圖片載入失敗</p>
            </div>
            <div class="name-line">
              <div class="name-zh">${p.name_zh || index}</div>
            </div>
          </div>
          <div class="card error">
            載入詳細資料失敗：${e.message}<br>
            <span class="note">請用本地伺服器開啟（VS Code Live Server 或 python -m http.server），file:// 無法 fetch JSON。</span>
          </div>
        `;
      }
    }

    buildDropdownItems('');
  </script>
