<head>

  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #5c6b7a;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --weak-2: #ef4444;
      --weak-4: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1rem; font-weight: 700; }
    .main-info {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .info-left {
      flex: 1 1 280px;
      min-width: 0;
    }
    .info-right {
      flex: 0 0 240px;
      text-align: center;
    }
    @media (max-width: 640px) {
      .info-right { flex: 1 1 100%; order: -1; }
      .info-left { flex: 1 1 100%; }
    }
    .search-wrap { position: relative; margin-bottom: 1.25rem; }
    .search-input {
      width: 100%; padding: 0.75rem 1rem; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text);
    }
    .search-input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dropdown-list {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      max-height: 360px; overflow-y: auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 50;
    }
    .dropdown-list.open { display: block; }
    .dropdown-item { padding: 0.55rem 1rem; cursor: pointer; font-size: 0.95rem; }
    .dropdown-item:hover, .dropdown-item.active { background: #eff6ff; color: var(--accent); }
    .dropdown-empty { padding: 0.75rem 1rem; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card); border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1.25rem; margin-bottom: 1rem;
    }
    .image-area {
      text-align: center; min-height: 160px;
      display: flex; align-items: center; justify-content: center;
    }
    .image-area img { max-width: 220px; max-height: 220px; object-fit: contain; }

    .form-btns {
      display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center;
      margin-top: 0.75rem;
    }
    .form-btn {
      padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.8rem; color: var(--text);
    }
    .form-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .ability-badge {
      display: inline-block; padding: 0.25rem 0.7rem; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; margin: 0.15rem 0.25rem 0.15rem 0;
      background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;
    }
    .ability-badge.ability-hidden {
      background: #f3e8ff; color: #7e22ce; border-color: #e9d5ff;
    }
    #abilities-area { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .ability-badge { cursor: help; position: relative; }
    .ability-tooltip {
      position: fixed; z-index: 9999; max-width: 320px;
      background: #1e293b; color: #f1f5f9; padding: 0.75rem 1rem;
      border-radius: 10px; font-size: 0.85rem; line-height: 1.5;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); pointer-events: none;
      white-space: pre-wrap; display: none;
    }
    .ability-tooltip .tip-name {
      font-weight: 700; margin-bottom: 0.35rem; color: #93c5fd;
    }
    .ability-tooltip .tip-loading { color: #94a3b8; font-style: italic; }

    .info-right .image-area { min-height: 200px; }
    .placeholder { color: var(--muted); font-size: 0.95rem; }
    .section-title {
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.6rem;
    }
    .types { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .type-badge {
      padding: 0.25rem 0.7rem; border-radius: 999px; font-size: 0.85rem;
      font-weight: 600; color: #fff; background: #64748b;
    }
    .type-一般 { background: #a8a878; }
    .type-火 { background: #f08030; }
    .type-水 { background: #6890f0; }
    .type-草 { background: #78c850; }
    .type-電, .type-电 { background: #f8d030; color: #333; }
    .type-冰 { background: #98d8d8; color: #333; }
    .type-格鬥, .type-格斗 { background: #c03028; }
    .type-毒 { background: #a040a0; }
    .type-地面 { background: #e0c068; color: #333; }
    .type-飛行, .type-飞行 { background: #a890f0; }
    .type-超能力 { background: #f85888; }
    .type-蟲, .type-虫 { background: #a8b820; }
    .type-岩石 { background: #b8a038; }
    .type-幽靈, .type-幽灵 { background: #705898; }
    .type-龍, .type-龙 { background: #7038f8; }
    .type-惡 { background: #705848; }
    .type-鋼, .type-钢 { background: #b8b8d0; color: #333; }
    .type-妖精 { background: #ee99ac; color: #333; }
    .weakness-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .weak-item {
      font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 6px;
      background: #fef2f2; color: var(--weak-2); border: 1px solid #fecaca;
    }
    .weak-item.x4 { background: #fee2e2; color: var(--weak-4); font-weight: 700; border-color: #fca5a5; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
    @media (min-width: 480px) { .stats-grid { grid-template-columns: repeat(6, 1fr); } }
    .stat-box { text-align: center; padding: 0.5rem; background: #f1f5f9; border-radius: 8px; }
    .stat-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.15rem; }
    .stat-value { font-size: 1.1rem; font-weight: 700; }
    .moves-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .tab-btn {
      padding: 0.35rem 0.8rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.85rem;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .moves-table-wrap { overflow-x: auto; max-height: 360px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.4rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; background: #f8fafc; font-weight: 600; color: var(--muted); font-size: 0.75rem; }
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
    .error { color: #dc2626; text-align: center; padding: 1rem; }
    .name-line { text-align: center; margin-bottom: 0.5rem; }
    .name-zh { font-size: 1.35rem; font-weight: 700; }
    .name-sub { font-size: 0.85rem; color: var(--muted); }
    .note { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 0.5rem; }
    .calc-controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center;
      margin-bottom: 1rem; font-size: 0.9rem;

    .calc-controls label { display: flex; align-items: center; gap: 0.4rem; }
    .calc-controls input[type="number"] {
      width: 4.2rem; padding: 0.3rem 0.4rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem;
    }
    .calc-controls select {
      padding: 0.3rem 0.5rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.85rem; max-width: 240px;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.75rem 1rem;
      align-items: start;
    }
    @media (max-width: 640px) {
      .calc-grid { grid-template-columns: 1fr; }
      .calc-col-result { order: -1; }
    }
    .calc-col {
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .calc-col-title {
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
      text-align: center; margin-bottom: 0.2rem;
    }
    .calc-row {
      display: flex; align-items: center; gap: 0.5rem;
      background: #f8fafc; border-radius: 10px; padding: 0.35rem 0.5rem;
    }
    .calc-row .stat-name {
      flex: 0 0 2.6rem; font-size: 0.8rem; font-weight: 600; text-align: center;
    }
    .calc-row input[type="range"] {
      flex: 1; min-width: 0; height: 6px; accent-color: var(--accent);
    }
    .calc-row input[type="number"] {
      width: 3.2rem; padding: 0.2rem 0.25rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.85rem; text-align: center;
    }
    .calc-col-result {
      min-width: 110px;
      background: #f1f5f9; border-radius: 12px; padding: 0.5rem;
      border: 1px solid var(--border);
    }
    .calc-result-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.35rem 0.5rem; border-radius: 8px; margin-bottom: 0.3rem;
      background: #fff;
    }
    .calc-result-item:last-child { margin-bottom: 0; }
    .calc-result-item .r-label { font-size: 0.8rem; color: var(--muted); }
    .calc-result-item .r-value { font-size: 1.05rem; font-weight: 700; }
    .calc-result-item.boost { background: #ecfdf5; }
    .calc-result-item.boost .r-value { color: #059669; }
    .calc-result-item.nerf { background: #fef2f2; }
    .calc-result-item.nerf .r-value { color: #dc2626; }
    .ev-total {
      font-size: 0.8rem; text-align: center; margin-top: 0.4rem;
      color: var(--muted);
    }
    .ev-total.over { color: #dc2626; font-weight: 600; }
    .calc-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.75rem; }
    .calc-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.75rem;
    }
    .calc-header .section-title { margin-bottom: 0; }
    .calc-actions { display: flex; gap: 0.4rem; }
    .calc-btn {
      padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.85rem; line-height: 1.2;
    }
    .calc-btn:hover { background: #f1f5f9; }
    .calc-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .calc-btn.primary:hover { filter: brightness(1.05); }
    .calc-btn.danger { color: #dc2626; }
    #calc-container { display: flex; flex-direction: column; gap: 1rem; }
    .calc-card-extra { border: 1px dashed #cbd5e1; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th.sortable .sort-ind { font-size: 0.7em; opacity: 0.6; margin-left: 2px; }
  </style>

        `<div class="dropdown-item" data-index="${p.index}" data-i="${i}">${p.index} - ${p.name_zh}</div>`

    function natureOptionText(n) {
      if (!n.boost) return n.name + " (±0)";

    function calcStat(base, iv, ev, level, isHP, natureMod) {
      const term = Math.floor((base * 2 + iv + Math.floor(ev / 4)) * level / 100);
      if (isHP) return term + level + 10;
      return Math.floor((term + 5) * natureMod);
    }

    function getNatureMod(nature, key) {
      if (!nature || !nature.boost) return 1.0;
      if (key === nature.boost) return 1.1;
      if (key === nature.nerf) return 0.9;
      return 1.0;
    }

    function getNum(id, def, min, max) {
      const el = document.getElementById(id);
      if (!el) return def;
      let v = parseInt(el.value, 10);
      if (isNaN(v)) v = def;
      return Math.max(min, Math.min(max, v));
    }

                         (currentData.name_en || "").toLowerCase() === "shedinja";
      if (isShedinja) {
        // 脫殼忍者 HP 固定，只把剩餘點分給 Def / SpD
        // 仍用相同邏輯
      }

      // 先讀取目前非血防的 EV，計算剩餘
      let used = 0;
      STAT_KEYS.forEach(k => { used += getNum(`ev-${cid}-${k}`, 0, 0, 252); });
      let remaining = 510 - used;
      if (remaining < 4) {
        alert("剩餘努力值不足 4 點，無法再分配。");
        return;
      }

      // 貪心：每次加 4 點到能讓 score = HP*(Def + SpD) 提升最多的那個
      const targets = isShedinja ? ["defense", "sp_defense"] : ["hp", "defense", "sp_defense"];

      while (remaining >= 4) {
        // 讀取「當前」已調整後的最終能力值（包含使用者手動拉過的 EV）
        const curHp = getFinalStat(cid, "hp");
        const curDef = getFinalStat(cid, "defense");
        const curSpd = getFinalStat(cid, "sp_defense");
        const phys = curHp * curDef;   // 物理耐久
        const spec = curHp * curSpd;   // 特殊耐久

        // 根據目前哪邊較弱，決定優先加的方向
        // 若物理較弱 → 優先考慮防禦或 HP
        // 若特殊較弱 → 優先考慮特防或 HP
        // 若相等 → 三者都可
        let preferred;
        if (phys < spec) {
          preferred = ["defense", "hp", "sp_defense"];
        } else if (spec < phys) {
          preferred = ["sp_defense", "hp", "defense"];
        } else {
          preferred = ["hp", "defense", "sp_defense"];
        }

        // 只保留實際還能加的目標
        preferred = preferred.filter(k => {
          const ev = getNum(`ev-${cid}-${k}`, 0, 0, 252);
          return targets.includes(k) && ev + 4 <= 252;
        });

        if (preferred.length === 0) break;

        let bestKey = null;
        let bestMin = -1;
        let bestSum = -1;
        let bestEv = 0;

        for (const key of preferred) {
          const curEv = getNum(`ev-${cid}-${key}`, 0, 0, 252);

          // 暫時加 4 並計算新耐久
          const el = document.getElementById(`ev-${cid}-${key}`);
          const range = document.getElementById(`ev-range-${cid}-${key}`);
          if (!el) continue;
          el.value = curEv + 4;
          if (range) range.value = curEv + 4;

          const newHp = getFinalStat(cid, "hp");
          const newDef = getFinalStat(cid, "defense");
          const newSpd = getFinalStat(cid, "sp_defense");
          const newPhys = newHp * newDef;
          const newSpec = newHp * newSpd;
          const newMin = Math.min(newPhys, newSpec);
          const newSum = newPhys + newSpec;

          // 還原
          el.value = curEv;
          if (range) range.value = curEv;

          if (newMin > bestMin || (newMin === bestMin && newSum > bestSum)) {
            bestMin = newMin;
            bestSum = newSum;
            bestKey = key;
            bestEv = curEv + 4;
          }
        }

        // 若因 flooring 導致分數都沒變，仍強制選第一個可加的（確保剩餘點數會被用完）
        if (!bestKey) {
          bestKey = preferred[0];
          bestEv = getNum(`ev-${cid}-${bestKey}`, 0, 0, 252) + 4;
        }

        // 真正加上
        const el = document.getElementById(`ev-${cid}-${bestKey}`);
        const range = document.getElementById(`ev-range-${cid}-${bestKey}`);
        if (el) el.value = bestEv;
        if (range) range.value = bestEv;
        remaining -= 4;
      }

      updateCalcResults(cid);
    }

function typeClass(t) { return 'type-' + t; }

    function renderWeaknesses(teData, formLabel = null) {
      if (!teData || !teData.length) return '<p class="placeholder">無弱點資料</p>';
      let entry = teData[0];
      if (formLabel && !isBaseFormLabel(formLabel, currentData)) {
        const key = extractFormKey(formLabel);
        entry = teData.find(t => t.form === formLabel)
            || (key ? teData.find(t => t.form && t.form.includes(key)) : null)
            || teData.find(t => t.form && (formLabel.includes(t.form) || t.form.includes(formLabel)))
            || teData.find(t => !t.form || t.form === '')
            || teData[0];
      } else {
        // 一般形態：優先用空 form，避開特性變體如「(引火)」
        entry = teData.find(t => !t.form || t.form === '')
            || teData.find(t => t.form && !t.form.startsWith('('))
            || teData[0];
      }
      const data = (entry && entry.data) || [];
      const weak = data.filter(d => parseFloat(d.damage) > 1);
      if (!weak.length) return '<p class="placeholder">無特別弱點</p>';
      return `<div class="weakness-grid">${weak.map(d => {
        const mul = parseFloat(d.damage);
        const cls = mul >= 4 ? 'x4' : 'x2';
        return `<span class="weak-item ${cls}">${d.type} ×${mul}</span>`;
      }).join('')}</div>`;
    }

    function renderTypes(types) {
      if (!types || !types.length) return '<span class="placeholder">—</span>';
      return types.map(t => `<span class="type-badge ${typeClass(t)}">${t}</span>`).join('');
    }

    function getFormTypes(formLabel, data) {
      if (!data || !data.forms) return [];
      const f = data.forms.find(x => x.name === formLabel)
             || data.forms.find(x => formLabel && x.name && (formLabel.includes(x.name) || x.name.includes(formLabel)))
             || data.forms[0];
      return (f && f.types) || [];
    }

    function getFormAbilities(formLabel, data) {
      if (!data || !data.forms) return [];
      const f = data.forms.find(x => x.name === formLabel)
             || data.forms.find(x => formLabel && x.name && (formLabel.includes(x.name) || x.name.includes(formLabel)))
             || data.forms[0];
      return (f && f.abilities) || [];
    }

    function renderAbilities(abilities) {
      if (!abilities || !abilities.length) return '<span class="placeholder">—</span>';
      return abilities.map(a => {
        const name = typeof a === 'string' ? a : (a.name || '');
        const hidden = typeof a === 'object' && a.is_hidden;
        const cls = hidden ? 'ability-badge ability-hidden' : 'ability-badge';
        const label = hidden ? `${name}（隱藏）` : name;
        const safe = name.replace(/"/g, '&quot;');
        return `<span class="${cls}" data-ability="${safe}" onmouseenter="showAbilityTip(event)" onmouseleave="hideAbilityTip()">${label}</span>`;
      }).join('');
    }

    // 特性效果快取與 tooltip
    const abilityCache = {};
    let tipEl = null;

    function ensureTipEl() {
      if (tipEl) return tipEl;
      tipEl = document.createElement('div');
      tipEl.className = 'ability-tooltip';
      tipEl.id = 'ability-tooltip';
      document.body.appendChild(tipEl);
      return tipEl;
    }

    function positionTip(e) {
      const el = ensureTipEl();
      const pad = 12;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      el.style.display = 'block';
      const rect = el.getBoundingClientRect();
      if (x + rect.width > window.innerWidth - 8) x = e.clientX - rect.width - pad;
      if (y + rect.height > window.innerHeight - 8) y = e.clientY - rect.height - pad;
      el.style.left = Math.max(8, x) + 'px';
      el.style.top = Math.max(8, y) + 'px';
    }

    async function showAbilityTip(e) {
      const name = e.currentTarget.getAttribute('data-ability');
      if (!name) return;
      const el = ensureTipEl();
      el.innerHTML = `<div class="tip-name">${name}</div><div class="tip-loading">載入中…</div>`;
      positionTip(e);

      // 跟隨滑鼠
      const moveHandler = (ev) => positionTip(ev);
      e.currentTarget._tipMove = moveHandler;
      document.addEventListener('mousemove', moveHandler);

      try {
        let data = abilityCache[name];
        if (!data) {
          const res = await fetch(`data/abilities/${encodeURIComponent(name)}.json`);
          if (!res.ok) throw new Error('not found');
          data = await res.json();
          abilityCache[name] = data;
        }
        const effect = data.effect || data.introduction || '（無效果說明）';
        el.innerHTML = `<div class="tip-name">${data.name_zh || name}</div><div>${effect}</div>`;
        // 重新定位（內容高度可能變了）
        positionTip(e);
      } catch (err) {
        el.innerHTML = `<div class="tip-name">${name}</div><div class="tip-loading">找不到特性資料</div>`;
      }
    }

    function hideAbilityTip() {
      if (tipEl) tipEl.style.display = 'none';
      // 移除可能殘留的 mousemove
      document.querySelectorAll('.ability-badge').forEach(b => {
        if (b._tipMove) {
          document.removeEventListener('mousemove', b._tipMove);
          b._tipMove = null;
        }
      });
    }

    function renderStats(statsOrData, formLabel = null) {
      let s = {};
      if (Array.isArray(statsOrData)) {
        if (!statsOrData.length) return '<p class="placeholder">無種族值</p>';
        // 若有指定 formLabel 就找對應，否則用第一筆
        if (formLabel) {
          const found = statsOrData.find(x => x.form === formLabel);
          s = (found && found.data) || (statsOrData[0] && statsOrData[0].data) || {};
        } else {
          s = (statsOrData[0] && statsOrData[0].data) || {};
        }
      } else if (statsOrData && typeof statsOrData === 'object') {
        s = statsOrData;
      } else {
        return '<p class="placeholder">無種族值</p>';
      }
      const labels = { hp: 'HP', attack: '攻擊', defense: '防禦', sp_attack: '特攻', sp_defense: '特防', speed: '速度' };
      return `<div class="stats-grid" id="stats-grid">${Object.entries(labels).map(([k, lab]) =>
        `<div class="stat-box"><div class="stat-label">${lab}</div><div class="stat-value" data-stat="${k}">${s[k] ?? '—'}</div></div>`
      ).join('')}</div>`;
    }

        // 招式表排序狀態
    let currentMovesSort = { key: null, dir: 1 }; // dir: 1 asc, -1 desc
    let currentMovesList = [];
    let currentMovesTab = 'learnable';

    const TYPE_ORDER = ['一般','火','水','草','電','冰','格鬥','毒','地面','飛行','超能力','蟲','岩石','幽靈','龍','惡','鋼','妖精'];
    const CAT_ORDER = { '物理': 0, '特殊': 1, '變化': 2 };

    function numOrNeg(v) {
      if (v === null || v === undefined || v === '' || v === '—' || v === '-') return -1;
      const n = parseFloat(v);
      return isNaN(n) ? -1 : n;
    }

    function sortMovesList(list, key, dir) {
      const arr = list.slice();
      arr.sort((a, b) => {
        let va, vb;
        if (key === 'type') {
          va = TYPE_ORDER.indexOf(a.type || '');
          vb = TYPE_ORDER.indexOf(b.type || '');
          if (va < 0) va = 999;
          if (vb < 0) vb = 999;
        } else if (key === 'category') {
          va = CAT_ORDER[a.category] ?? 9;
          vb = CAT_ORDER[b.category] ?? 9;
        } else if (key === 'power') {
          va = numOrNeg(a.power);
          vb = numOrNeg(b.power);
          // 高威力優先 → 我們用 desc 為預設
        } else if (key === 'accuracy') {
          va = numOrNeg(a.accuracy);
          vb = numOrNeg(b.accuracy);
        } else if (key === 'level') {
          va = numOrNeg(a.level);
          vb = numOrNeg(b.level);
        } else {
          return 0;
        }
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        // 次要：等級
        const la = numOrNeg(a.level), lb = numOrNeg(b.level);
        return la - lb;
      });
      return arr;
    }


    /** 切換型態：更新種族值顯示、圖片、以及計算用的 base stats */
    function switchForm(formLabel) {
      if (!currentData) return;

      currentFormLabel = formLabel;

      // 種族值：用強化後的 form 對應
      const entry = findStatsEntry(formLabel, currentData);
      currentBaseStats = { ...((entry && entry.data) || {}) };

      // 更新種族值數字
      const area = document.getElementById('stats-area');
      if (area) area.innerHTML = renderStats(currentBaseStats);

      // 更新屬性
      const typesEl = document.getElementById('types-area');
      if (typesEl) {
        const formTypes = getFormTypes(formLabel, currentData);
        typesEl.innerHTML = renderTypes(formTypes);
      }

      // 更新弱點
      const weakEl = document.getElementById('weakness-area');
      if (weakEl && currentData.type_effectiveness) {
        weakEl.innerHTML = renderWeaknesses(currentData.type_effectiveness, formLabel);
      }

      // 更新特性
      const abEl = document.getElementById('abilities-area');
      if (abEl) {

      // 更新按鈕 active 狀態

        btn.classList.toggle('active', btn.dataset.form === formLabel);
      });

      // 更新圖片
      const img = document.getElementById('poke-img');
      if (img) {
        const index = currentData.pokedex_id || selectedIndex || '';
        const newSrc = resolveFormImage(formLabel, index, currentData);
        img.style.display = '';
        img.src = newSrc;
        const errP = img.nextElementSibling;
        if (errP) errP.style.display = 'none';
        img.onerror = function() {
          this.src = `data/images/home/${index}.png`;
          this.onerror = function() {
            this.style.display = 'none';
            if (this.nextElementSibling) this.nextElementSibling.style.display = 'block';
          };
        };
      }

      // 重新計算所有已開啟的能力值區塊
      document.querySelectorAll('[id^="calc-results-"]').forEach(el => {
        const cid = el.id.replace('calc-results-', '');
        if (typeof updateCalcResults === 'function') updateCalcResults(cid);
      });
    }

    /** 地區／形態關鍵字，用於 forms ↔ stats ↔ 檔名 對應 */
    const FORM_KEYWORDS = ['阿羅拉', '洗翠', '伽勒爾', '帕底亞', '祂夏', '白波動', '黑波動',
      '超級', '超極巨化', '太晶', '起源', '加熱', '清洗', '冰冷', '普通形態', '攻擊形態',
      '防禦形態', '速度形態', '陽光', '雨水', '雪花', '砂土', '晴天', '陰天'];

    function extractFormKey(name) {
      if (!name) return '';
      for (const kw of FORM_KEYWORDS) {
        if (name.includes(kw)) return kw;
      }
      return name;
    }

    function isBaseFormLabel(formLabel, data) {
      const species = (data && data.name_zh) || '';
      const forms = (data && data.forms) || [];
      const firstFormName = forms.length ? (forms[0].name || '') : species;
      return !formLabel
          || formLabel === firstFormName
          || formLabel === species
          || formLabel === '一般' || formLabel === '普通'
          || formLabel.includes('一般') || formLabel === '普通的樣子'
          || formLabel === '普通形態' || formLabel === '一般的樣子';
    }

    /** 從 stats 找對應 form 的種族值 */
    function findStatsEntry(formLabel, data) {
      const stats = (data && data.stats) || [];
      if (!stats.length) return null;
      if (isBaseFormLabel(formLabel, data)) return stats[0];

      // 1. 完全相符
      let entry = stats.find(s => s.form === formLabel);
      if (entry) return entry;

      // 2. 關鍵字相符（阿羅拉九尾 ↔ 阿羅拉的樣子）
      const key = extractFormKey(formLabel);
      if (key) {
        entry = stats.find(s => s.form && s.form.includes(key));
        if (entry) return entry;
      }

      // 3. 互相包含
      entry = stats.find(s => s.form && (formLabel.includes(s.form) || s.form.includes(formLabel)));
      if (entry) return entry;

      // 4. 極巨化等無獨立 stats → 用一般
      return stats[0];
    }

    /** 依 forms 名稱解析圖片路徑 */
    function resolveFormImage(formLabel, index, data) {
      const species = (data && data.name_zh) ? data.name_zh : '';

      if (isBaseFormLabel(formLabel, data)) {
        return `data/images/home/${index}.png`;
      }

      // 1. 優先用 home_images 裡的對應檔名
      const himgs = (data && data.home_images) || [];
      if (himgs.length) {
        const key = extractFormKey(formLabel);
        let match = himgs.find(h => h.name === formLabel);
        if (!match && key) {
          match = himgs.find(h => h.name && h.name.includes(key));
        }
        if (!match) {
          match = himgs.find(h => h.name && (h.name.includes(formLabel) || formLabel.includes(h.name)));
        }
        // 跳過純種族名那一筆
        if (match && match.image && match.name !== species && match.name !== formLabel.split('-')[0]) {
          // home_images 的 image 多半已是完整檔名
          const imgName = match.image;
          // 一般圖在 home/，形態圖在 other/
          if (imgName === `${index}.png` || imgName === `${index}-${species}.png`) {
            return `data/images/home/${imgName}`;
          }
          return `data/images/home/other/${imgName}`;
        }
      }

      // 2. 依關鍵字組檔名
      let suffix = formLabel;
      if (formLabel.includes('超極巨化')) {
        suffix = '超極巨化';
      } else {
        const key = extractFormKey(formLabel);
        // 阿羅拉九尾 → 阿羅拉的樣子（檔名慣例）
        if (key === '阿羅拉') suffix = '阿羅拉的樣子';
        else if (key === '洗翠') suffix = '洗翠的樣子';
        else if (key === '伽勒爾') suffix = '伽勒爾的樣子';
        else if (key === '帕底亞') suffix = '帕底亞的樣子';
        else if (key) suffix = key;
      }

      if (species) {
        return `data/images/home/other/${index}-${species}-${suffix}.png`;
      }
      return `data/images/home/other/${index}-${suffix}.png`;
    }


    function renderMovesTable(moves, formIndex = 0, sortKey = null, sortDir = 1) {
      if (!moves || !moves.length) return '<p class="placeholder">無招式資料</p>';
      let list = (moves[formIndex] && moves[formIndex].data) ? moves[formIndex].data : (Array.isArray(moves) ? moves : []);
      if (!list.length) return '<p class="placeholder">無招式</p>';

      // 保存原始列表供排序
      currentMovesList = list;

      if (sortKey) {
        list = sortMovesList(list, sortKey, sortDir);
      }

      const ind = (k) => {
        if (currentMovesSort.key !== k) return '';
        return currentMovesSort.dir === 1 ? ' ↑' : ' ↓';
      };

      return `<div class="moves-table-wrap"><table>
        <thead><tr>
          <th class="sortable" onclick="sortMoves('level')">等級<span class="sort-ind">${ind('level')}</span></th>
          <th>招式</th>
          <th class="sortable" onclick="sortMoves('type')">屬性<span class="sort-ind">${ind('type')}</span></th>
          <th class="sortable" onclick="sortMoves('category')">分類<span class="sort-ind">${ind('category')}</span></th>
          <th class="sortable" onclick="sortMoves('power')">威力<span class="sort-ind">${ind('power')}</span></th>
          <th class="sortable" onclick="sortMoves('accuracy')">命中<span class="sort-ind">${ind('accuracy')}</span></th>
          <th>PP</th>
        </tr></thead>
        <tbody>${list.map(m => `<tr>
          <td>${m.level ?? '—'}</td><td>${m.name ?? '—'}</td>
          <td><span class="type-badge ${typeClass(m.type || '')}" style="font-size:0.75rem;padding:0.1rem 0.4rem">${m.type || '—'}</span></td>
          <td>${m.category ?? '—'}</td><td>${m.power ?? '—'}</td><td>${m.accuracy ?? '—'}</td><td>${m.pp ?? '—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }

    function sortMoves(key) {
      if (currentMovesSort.key === key) {
        currentMovesSort.dir *= -1;
      } else {
        currentMovesSort.key = key;
        // 威力、命中預設由高到低；其他由低到高
        currentMovesSort.dir = (key === 'power' || key === 'accuracy') ? -1 : 1;
      }
      const area = document.getElementById('moves-area');
      if (!area || !currentData) return;
      const tab = currentMovesTab;
      let src;
      if (tab === 'learnable') src = currentData.learnable_moves;
      else if (tab === 'machine') src = currentData.machine_moves;
      else src = currentData.egg_moves;
      area.innerHTML = renderMovesTable(src, 0, currentMovesSort.key, currentMovesSort.dir);
    }


        function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
      currentMovesTab = tab;
      currentMovesSort = { key: null, dir: 1 }; // 換 tab 重置排序
      const area = document.getElementById('moves-area');
      if (!currentData || !area) return;
      if (tab === 'learnable') area.innerHTML = renderMovesTable(currentData.learnable_moves);
      else if (tab === 'machine') area.innerHTML = renderMovesTable(currentData.machine_moves);
      else if (tab === 'egg') area.innerHTML = renderMovesTable(currentData.egg_moves);
    }

    async function loadPokemon(index) {
      if (!index) {
        contentEl.innerHTML = `<div class="card image-area"><p class="placeholder">輸入或選擇寶可夢以顯示資料</p></div>`;
        return;
      }

      contentEl.innerHTML = `<div class="card loading">載入中…</div>`;

      // 改名後的簡單規則：0001.json / 0001.png
      const pokeFile = index + '.json';
      const imgFile = index + '.png';
      const imgSrc = `data/images/home/${imgFile}`;

      try {
        const res = await fetch(`data/pokemon/${pokeFile}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentData = data;

        // 預設用第一筆 stats 作為目前種族值；form 標籤用 forms[0]
        const firstStats = (data.stats && data.stats[0] && data.stats[0].data) || {};
        currentBaseStats = { ...firstStats };
        const formNames = (data.forms || []).map(f => f.name).filter(Boolean);
        currentFormLabel = formNames[0] || data.name_zh || '一般';

        const nameZh = data.name_zh || (pokedex.find(p => p.index === index) || {}).name_zh || index;
        const nameEn = data.name_en || '';
        const nameJa = data.name_ja || data.name_jp || '';
        // 初始屬性優先用 forms[0].types（比 type_effectiveness 順序更可靠）
        const types = (data.forms && data.forms[0] && data.forms[0].types)
                   || (data.type_effectiveness && data.type_effectiveness.find(t => !t.form || t.form === '') || {}).types
                   || (data.type_effectiveness && data.type_effectiveness[0] && data.type_effectiveness[0].types)
                   || [];

        // 產生 form 切換按鈕（以 forms 為準，可含超極巨化等）
        let formButtonsHtml = '';
        if (formNames.length > 1) {
          formButtonsHtml = formNames.map((f, i) => {
            const active = i === 0 ? ' active' : '';
            const safe = f.replace(/'/g, "\\'");
            return `<button class="form-btn${active}" data-form="${f}" onclick="switchForm('${safe}')">${f}</button>`;
          }).join('');
        }

        contentEl.innerHTML = `
          <div class="card main-info">
            <div class="info-left">
              <div class="name-line" style="text-align:left; margin-bottom:0.75rem">
                <div class="name-zh">${nameZh}</div>
                <div class="name-sub">${nameEn}${nameJa ? ' / ' + nameJa : ''}</div>
              </div>
              <div class="section-title">屬性</div>
              <div class="types" id="types-area">
                ${types.length ? renderTypes(types) : '<span class="placeholder">—</span>'}
              </div>
              <div class="section-title" style="margin-top:1rem">種族值</div>
              <div id="stats-area">${renderStats(data.stats)}</div>
              <div class="section-title" style="margin-top:1rem">弱點（受到傷害倍率）</div>
              <div id="weakness-area">${renderWeaknesses(data.type_effectiveness)}</div>
              <div class="section-title" style="margin-top:1rem">特性</div>
              <div id="abilities-area">${renderAbilities(getFormAbilities(currentFormLabel, data))}</div>
            </div>
            <div class="info-right">
              <div class="image-area">
                <img id="poke-img" src="${imgSrc}" alt="${nameZh}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <p class="placeholder" style="display:none">圖片載入失敗（${imgFile}）</p>
              </div>
              <div class="form-btns" id="form-btns">${formButtonsHtml}</div>
            </div>
          </div>
                    <div id="calc-container"></div>
<div class="card">
            <div class="section-title">招式表</div>
            <div class="moves-tabs">
              <button class="tab-btn active" data-tab="learnable" onclick="switchTab('learnable')">升級習得</button>
              <button class="tab-btn" data-tab="machine" onclick="switchTab('machine')">招式機</button>
              <button class="tab-btn" data-tab="egg" onclick="switchTab('egg')">遺傳招式</button>
            </div>
            <div id="moves-area">${renderMovesTable(data.learnable_moves)}</div>
          </div>
        `;
        // 初始計算
        setTimeout(initPrimaryCalc, 0);
      } catch (e) {
        // 即使詳細資料載入失敗，仍嘗試顯示圖片 + 名稱
        const p = pokedex.find(x => x.index === index) || {};
        contentEl.innerHTML = `
          <div class="card main-info">
            <div class="info-left">
              <div class="name-line" style="text-align:left">
                <div class="name-zh">${p.name_zh || index}</div>
              </div>
            </div>
            <div class="info-right">
              <div class="image-area">
                <img src="${imgSrc}" alt="${p.name_zh || index}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <p class="placeholder" style="display:none">圖片載入失敗</p>
              </div>
            </div>
          </div>
          <div class="card error">
            載入詳細資料失敗：${e.message}<br>
            <span class="note">請用本地伺服器開啟（VS Code Live Server 或 python -m http.server），file:// 無法 fetch JSON。</span>
          </div>
        `;
      }
    }

    buildDropdownItems('');
  </script>
</body>
</html>
